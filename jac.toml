[project]
name = "ember"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[dependencies]
[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
three = "^0.160.0"
thinking-orbs = "^0.1.1"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "4.7.0"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
"@types/three" = "^0.160.0"



[dev-dependencies]
watchdog = ">=3.0.0"

[byllm.model]
api_key = "${LLM_API_KEY}"
default_model = "${LLM_MODEL:-gpt-4o-mini}"

[check]
# Browser-global interop (window.*, new(SpeechRecognition/SynthesisUtterance, ...))
# has no typed stubs in the checker yet - correct at runtime, jac-cl-js-interop
# guide's documented false positive. See VoiceControls.cl.jac / .impl.jac.
suppress = ["E1030", "E1031", "E1053"]

[serve]
base_route_app = "app"

[client]
